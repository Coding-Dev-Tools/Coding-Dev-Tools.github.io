<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found | DevForge by Coding Dev Tools</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#6366f1; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:3rem 2.5rem; max-width:520px; text-align:center; }
    h1 { font-size:4rem; color:var(--accent); margin-bottom:.5rem; }
    p { color:var(--muted); margin-bottom:1.5rem; line-height:1.6; }
    a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:.75rem 1.5rem; border-radius:8px; font-weight:600; }
    a.btn:hover { opacity:.9; }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>That page doesn't exist (or moved). All guides and CLI tools live on the homepage.</p>
    <a class="btn" href="/">Back to DevForge home</a>
  </main>
</body>
</html>
